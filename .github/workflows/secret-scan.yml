name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # v3, car gitleaks-action@v2 est en fin de vie (dependant de Node 20,
      # retire le 16/09/2026 selon la page Marketplace du projet) - a reverifier
      # avant la premiere execution reelle en CI.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
